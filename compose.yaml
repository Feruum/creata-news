name: creata-news
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creata
      POSTGRES_USER: creata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup-local first}
    ports: ["127.0.0.1:${CREATA_DATABASE_PORT:-54328}:5432"]
    volumes: ["creata-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creata -d creata"]
      interval: 3s
      retries: 20
  backend:
    build: {context: ., dockerfile: backend/creata/Dockerfile}
    environment:
      DATABASE_URL: postgres://creata:${POSTGRES_PASSWORD}@postgres:5432/creata?sslmode=disable
      CREATA_ENV: ${CREATA_ENV:-development}
      CREATA_MEDIA_DIR: /app/uploads
      CREATA_DEV_AUTH: "0"
      CREATA_SESSION_SECRET: ${CREATA_SESSION_SECRET:-}
      CREATA_WORKER_TOKEN: ${CREATA_WORKER_TOKEN:-}
      CREATA_BOT_SERVICE_TOKEN: ${CREATA_BOT_SERVICE_TOKEN:-}
      CREATA_SSR_TOKEN: ${CREATA_SSR_TOKEN:-}
      CREATA_TRUSTED_PROXIES: ${CREATA_TRUSTED_PROXIES:-}
      CREATA_ALLOW_PRIVATE_SOURCES: ${CREATA_ALLOW_PRIVATE_SOURCES:-0}
      CREATA_ORIGINS: ${CREATA_ORIGINS:-}
      CREATA_PUBLIC_URL: ${CREATA_PUBLIC_URL:-http://localhost:3002}
      CREATA_API_URL: ${CREATA_API_URL:-http://localhost:5555}
      CREATA_COOKIE_DOMAIN: ${CREATA_COOKIE_DOMAIN:-}
      CREATA_GOOGLE_CLIENT_ID: ${CREATA_GOOGLE_CLIENT_ID:-}
      CREATA_GOOGLE_CLIENT_SECRET: ${CREATA_GOOGLE_CLIENT_SECRET:-}
      CREATA_TELEGRAM_CLIENT_ID: ${CREATA_TELEGRAM_CLIENT_ID:-}
      CREATA_TELEGRAM_CLIENT_SECRET: ${CREATA_TELEGRAM_CLIENT_SECRET:-}
      CREATA_S3_ENDPOINT: ${CREATA_S3_ENDPOINT:-}
      CREATA_S3_REGION: ${CREATA_S3_REGION:-us-east-1}
      CREATA_S3_BUCKET: ${CREATA_S3_BUCKET:-}
      CREATA_S3_ACCESS_KEY: ${CREATA_S3_ACCESS_KEY:-}
      CREATA_S3_SECRET_KEY: ${CREATA_S3_SECRET_KEY:-}
      CREATA_MEDIA_PUBLIC_URL: ${CREATA_MEDIA_PUBLIC_URL:-}
      CREATA_POSTIZ_API_URL: ${CREATA_POSTIZ_API_URL:-}
      CREATA_POSTIZ_API_KEY: ${CREATA_POSTIZ_API_KEY:-}
      CREATA_POSTIZ_MODE: ${CREATA_POSTIZ_MODE:-}
      CREATA_TELEGRAM_BOT_USERNAME: ${CREATA_TELEGRAM_BOT_USERNAME:-}
      CREATA_TELEGRAM_CHANNEL_ID: ${CREATA_TELEGRAM_CHANNEL_ID:-}
      CREATA_TELEGRAM_CHANNEL_ONLY: ${CREATA_TELEGRAM_CHANNEL_ONLY:-0}
      CREATA_TELEGRAM_BOT_CONFIGURED: ${TELEGRAM_BOT_TOKEN:+1}
    ports: ["127.0.0.1:${CREATA_API_PORT:-5555}:5555"]
    volumes: ["creata-media:/app/uploads"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: creatanews/Dockerfile
      args: {CREATA_API_ORIGIN: "http://backend:5555"}
    environment:
      CREATA_API_ORIGIN: http://backend:5555
      CREATA_PUBLIC_URL: ${CREATA_PUBLIC_URL:-http://localhost:3002}
      CREATA_SSR_TOKEN: ${CREATA_SSR_TOKEN:-}
    ports: ["127.0.0.1:${CREATA_WEB_PORT:-3002}:3002"]
    depends_on: [backend]
  editorial:
    build:
      context: .
      dockerfile: events-admin/Dockerfile
      args:
        VITE_WEB_URL: ${CREATA_PUBLIC_URL:-http://localhost:3002}
        VITE_EDITORIAL_URL: ${CREATA_EDITORIAL_URL:-http://localhost:6868}
        VITE_HERMES_ADMIN_URL: ${CREATA_HERMES_ADMIN_URL:-http://localhost:5174}
    ports: ["127.0.0.1:${CREATA_EDITORIAL_PORT:-6868}:80"]
    depends_on: [backend]
  hermes-admin:
    build:
      context: .
      dockerfile: agent-admin/Dockerfile
      args:
        VITE_WEB_URL: ${CREATA_PUBLIC_URL:-http://localhost:3002}
        VITE_EDITORIAL_URL: ${CREATA_EDITORIAL_URL:-http://localhost:6868}
        VITE_HERMES_ADMIN_URL: ${CREATA_HERMES_ADMIN_URL:-http://localhost:5174}
    ports: ["127.0.0.1:${CREATA_HERMES_PORT:-5174}:80"]
    depends_on: [backend]
  hermes-worker:
    build: {context: ., dockerfile: hermes-worker/Dockerfile}
    environment:
      CREATA_ENV: ${CREATA_ENV:-development}
      CREATA_API_ORIGIN: http://backend:5555
      CREATA_WORKER_TOKEN: ${CREATA_WORKER_TOKEN:-}
      CREATA_WORKER_ID: ${CREATA_WORKER_ID:-}
      CREATA_WORKER_STATE_DIR: /app/state
      CREATA_ALLOW_PRIVATE_SOURCES: ${CREATA_ALLOW_PRIVATE_SOURCES:-0}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_COLLECTOR_SESSION: ${TELEGRAM_COLLECTOR_SESSION:-}
      TELEGRAM_COLLECTOR_SESSION_FILE: ${TELEGRAM_COLLECTOR_SESSION_FILE:-}
    volumes: ["hermes-state:/app/state"]
    depends_on: [backend]
    restart: unless-stopped
  telegram-bot:
    build: {context: ., dockerfile: telegram-bot/Dockerfile.creata}
    environment:
      CREATA_ENV: ${CREATA_ENV:-development}
      CREATA_API_ORIGIN: http://backend:5555
      CREATA_BOT_SERVICE_TOKEN: ${CREATA_BOT_SERVICE_TOKEN:-}
      CREATA_PUBLIC_URL: ${CREATA_PUBLIC_URL:-http://localhost:3002}
      CREATA_TELEGRAM_CHANNEL_ID: ${CREATA_TELEGRAM_CHANNEL_ID:-}
      CREATA_TELEGRAM_CHANNEL_ONLY: ${CREATA_TELEGRAM_CHANNEL_ONLY:-0}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      HTTP_PORT: "3001"
    ports: ["127.0.0.1:${CREATA_BOT_PORT:-3031}:3001"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  creata-db:
  creata-media:
  hermes-state:
