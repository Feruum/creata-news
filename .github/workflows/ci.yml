name: Creata checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: creata_test, POSTGRES_USER: creata, POSTGRES_PASSWORD: creata-test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U creata" --health-interval 5s --health-retries 10
    env:
      CREATA_TEST_DATABASE_URL: postgres://creata:creata-test@localhost:5432/creata_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.4.2"}
      - uses: actions/setup-go@v5
        with: {go-version-file: backend/creata/go.mod, cache-dependency-path: backend/creata/go.sum}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: bun install --frozen-lockfile
      - run: bun scripts/generate-contracts.ts --check
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - run: bun test scripts/local-ports.test.ts
      - run: go test -race ./...
        working-directory: backend/creata
      - run: python -m pip install -r hermes-worker/requirements.txt
      - run: python -m unittest discover -s hermes-worker/tests -v
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:pipeline
        env:
          PLAYWRIGHT_CHANNEL: chromium
      # https://github.com/actions/upload-artifact#usage
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pipeline-browser-evidence
          include-hidden-files: true
          path: |
            .runtime/screenshots/
            creatanews/test-results/
            events-admin/test-results/
